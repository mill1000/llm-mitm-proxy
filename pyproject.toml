[build-system]
requires = ["setuptools>=68", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-proxy"
dynamic = ["version"]
description = "Low-overhead OpenAI-compatible LLM proxy with a live conversation WebUI"
readme = "README.md"
# 3.11 floor: websockets (via uvicorn[standard]) requires >=3.11.
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx2>=2",
]

[project.optional-dependencies]
dev = [
    "isort>=5",
    "black>=24",
]

[project.scripts]
llm-proxy = "llm_proxy.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_proxy*"]

[tool.isort]
profile = "black"
known_first_party = ["llm_proxy"]

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.setuptools_scm]
# Version is derived from git tags (CalVer, e.g. 2026.09.08). The Docker build
# context has no .git, so builds without --build-arg VERSION fall back to this.
fallback_version = "0.0.0+local"
