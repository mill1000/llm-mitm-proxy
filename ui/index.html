<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>llm-mitm-proxy</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">llm-mitm-proxy</div>
      <div class="top-status">
        <span id="stat-upstream" class="pill">upstream: …</span>
        <span id="stat-ws" class="pill ws-off">ws: off</span>
      </div>
    </header>

    <div class="layout">
      <aside class="dock">
        <div class="dock-head">
          <span class="dock-title">Conversations</span>
          <input id="filter" type="search" placeholder="filter…" autocomplete="off" />
        </div>
        <ul id="dock-list" class="dock-list"></ul>
        <div id="dock-empty" class="dock-empty">No traffic yet.</div>
      </aside>

      <main class="main">
        <div id="empty" class="empty"><p id="empty-msg">Select a conversation on the left.</p></div>

        <div id="conv" class="conv" hidden>
          <div class="conv-head">
            <span id="conv-title" class="conv-title"></span>
            <div class="conv-actions">
              <label class="stick"><input type="checkbox" id="stick" checked /> auto-scroll</label>
              <label class="stick"><input type="checkbox" id="md" checked /> markdown</label>
              <button id="btn-export" class="btn">Export</button>
              <button id="btn-clear" class="btn danger">Clear</button>
            </div>
          </div>
          <div id="ex-list" class="ex-list"></div>

          <div id="replay-dock" class="replay-dock" hidden>
            <div class="rd-grip" title="Drag to resize" aria-hidden="true"></div>
            <div class="rd-head">
              <span class="rd-title">Replay</span>
              <span id="rd-sub" class="rd-sub"></span>
              <span class="rd-spacer"></span>
              <button id="rd-cancel" class="btn btn-sm">Cancel</button>
              <button id="rd-send" class="btn btn-sm accent">Send</button>
            </div>
            <div class="rd-fields">
              <label class="rd-f"><span>model</span><input id="rd-model" type="text" autocomplete="off" /></label>
              <label class="rd-f"><span>temperature</span><input id="rd-temperature" type="number" step="0.1" autocomplete="off" /></label>
              <label class="rd-f"><span>top_p</span><input id="rd-top_p" type="number" step="0.01" min="0" max="1" autocomplete="off" /></label>
              <label class="rd-f"><span>max_tokens</span><input id="rd-max_tokens" type="number" autocomplete="off" /></label>
              <label class="rd-f rd-check"><input id="rd-stream" type="checkbox" /><span>stream</span></label>
            </div>
            <textarea id="rd-body" class="rd-body" spellcheck="false" aria-label="request body (JSON)"></textarea>
            <div id="rd-status" class="rd-status"></div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
