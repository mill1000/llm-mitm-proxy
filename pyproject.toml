[build-system]
requires = ["setuptools>=68", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-mitm-proxy"
dynamic = ["version"]
description = "A simple transparent MITM proxy for LLM APIs with a live Web UI"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx2>=2",
]

[project.optional-dependencies]
dev = [
    "isort>=5",
    "black>=24",
]

[project.urls]
Repository = "https://github.com/mill1000/llm-mitm-proxy"
Issues = "https://github.com/mill1000/llm-mitm-proxy/issues"

[project.scripts]
llm-mitm-proxy = "llm_proxy.app:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_proxy", "llm_proxy.*"]
exclude = ["llm_proxy.tests"]

[tool.setuptools.package-data]
llm_proxy = [
    "web/index.html",
    "web/app.js",
    "web/styles.css",
    "web/favicon.svg",
]

[tool.isort]
profile = "black"
known_first_party = ["llm_proxy"]

[tool.black]
line-length = 110
target-version = ["py312"]

[tool.setuptools_scm]
fallback_version = "0.0.0+local"
