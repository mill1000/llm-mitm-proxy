name: Code Quality Checks
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

# Kill existing jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip
          pip install black isort
      - run: black --check --diff llm_proxy
      - run: isort --check-only --diff llm_proxy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify:js

  run-unittest:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          # History/tags required to generate version info
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: python -c "import sys; print(sys.version)"
      # Build the UI so the in-package serving + packaging tests run (they
      # skip when llm_proxy/web is absent).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          python -m pip install --upgrade pip
          pip install --editable .
      - run: python -m unittest
