services:
  llm-proxy:
    build: .
    image: llm-proxy:latest
    restart: unless-stopped
    ports:
      - "8080:8080" # LLM API proxy (clients point here)
      - "9090:9090" # WebUI + proxy API
    environment:
      UPSTREAM_BASE_URL: "http://host.docker.internal:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
